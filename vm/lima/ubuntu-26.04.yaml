# Lima --plain guest: Ubuntu 26.04 LTS (resolved stub, AppArmor, buddelkiste-unshare profile).
minimumLimaVersion: 2.0.0
base:
- template:ubuntu-26.04

plain: true
cpus: 2
memory: "2GiB"
disk: "20GiB"

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    user="{{.User}}"
    core=(
      python3 python3-venv python3-pip curl git rsync ca-certificates
      bubblewrap passt slirp4netns nftables uidmap
    )
    extra=(docker.io docker-buildx rootlesskit fuse-overlayfs)
    missing=()
    for p in "${core[@]}"; do
      dpkg-query -W -f='${Status}\n' "$p" 2>/dev/null | grep -q "ok installed" \
        || missing+=("$p")
    done
    if ((${#missing[@]})); then
      apt-get update
      apt-get install -y "${missing[@]}"
    fi
    extra_missing=()
    for p in "${extra[@]}"; do
      dpkg-query -W -f='${Status}\n' "$p" 2>/dev/null | grep -q "ok installed" \
        || extra_missing+=("$p")
    done
    if ((${#extra_missing[@]})); then
      apt-get update
      # One install per extra so a missing optional package does not skip docker.
      for p in "${extra_missing[@]}"; do
        apt-get install -y "$p" || echo "WARN: optional package $p not installed" >&2
      done
    fi
    if ! grep -q "^${user}:" /etc/subuid; then
      echo "${user}:100000:65536" >> /etc/subuid
    fi
    if ! grep -q "^${user}:" /etc/subgid; then
      echo "${user}:100000:65536" >> /etc/subgid
    fi
    # README "Ubuntu: slirp4netns and AppArmor" profile; keep the two in sync.
    profile=/etc/apparmor.d/buddelkiste-unshare
    cat > "${profile}.new" <<'EOF'
    # Allow util-linux unshare to create unprivileged user namespaces
    # (buddelkiste network.backend = "slirp4netns" on Ubuntu 23.10+).
    abi <abi/4.0>,
    include <tunables/global>

    profile buddelkiste-unshare /usr/bin/unshare flags=(unconfined) {
      userns,

      include if exists <local/buddelkiste-unshare>
    }
    EOF
    mv "${profile}.new" "${profile}"
    apparmor_parser -r "${profile}"
    # Rootful engine for docker-proxy e2e; the guest user talks to the socket.
    if command -v dockerd >/dev/null 2>&1; then
      getent group docker >/dev/null || groupadd docker
      id -nG "${user}" | tr ' ' '\n' | grep -qx docker || usermod -aG docker "${user}"
      systemctl enable --now docker.socket docker.service || true
    fi
- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export PATH="${HOME}/.local/bin:${PATH}"
    if ! command -v uv >/dev/null 2>&1; then
      curl -LsSf https://astral.sh/uv/install.sh | sh
    fi
